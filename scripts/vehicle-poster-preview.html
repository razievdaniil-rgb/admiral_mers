<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: #0b0e13;
        color: white;
        font: 16px system-ui;
      }
      #render {
        position: relative;
        width: 900px;
        height: 500px;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      select {
        padding: 10px;
        width: 650px;
      }
    </style>
  </head>
  <body>
    <div id="render"></div>
    <select id="models"></select
    ><span id="status"></span>
    <script type="module">
      import { createVehicleEngine } from "/src/vehicle-engine.ts";
      import { vehicles, heroVehicle } from "/src/vehicle-library.ts";
      const host = document.querySelector("#render"),
        select = document.querySelector("#models"),
        status = document.querySelector("#status");
      const engine = createVehicleEngine(host, false, (s) => {
        status.textContent = s;
        host.dataset.status = s;
      });
      for (const v of [heroVehicle, ...vehicles]) {
        const option = document.createElement("option");
        option.value = v.file;
        option.textContent = v.id + " · " + v.name;
        select.append(option);
      }
      select.onchange = () =>
        engine.load(
          select.value === "mercedes-benz-mersedes-s65.glb"
            ? "hero-optimized.glb"
            : select.value,
          false,
        );
      select.onchange();
    </script>
  </body>
</html>
